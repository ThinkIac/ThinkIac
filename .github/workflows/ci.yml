name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run test suites
        shell: bash
        run: |
          if npm run test:all 2>&1 | tee "$RUNNER_TEMP/thinkiac-tests.log"; then
            exit 0
          fi
          {
            echo '### Failed test suites'
            echo
            echo '```text'
            grep -E -A 18 '^(not ok|FAIL[[:space:]]|TIMEOUT[[:space:]]|Suite summary)' "$RUNNER_TEMP/thinkiac-tests.log" | tail -180 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(not ok|FAIL[[:space:]]|TIMEOUT[[:space:]])' "$RUNNER_TEMP/thinkiac-tests.log" |
            while IFS= read -r failure; do
              echo "::error::${failure//%/%25}"
            done || true
          exit 1
      - run: npm run test:runner
      - run: npm exec -- vitest run --root vendor/packages/logos tests/logos-dependencies.test.ts tests/scriba-reactivity.browser.test.ts
