name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - name: Build independent kernel
        run: npm run build
      - name: Boot the kernel without downloaded modules
        run: node launcher/kernel-smoke.cjs
      - name: Install resource lifecycle test dependencies
        working-directory: vendor/packages/logos
        run: npm install --legacy-peer-deps --no-save --package-lock=false git+https://github.com/ThinkIac/stabilizer.git#b85b49d49cca5fe63b5d612fd4c411bda1212564
      - name: Test resource resolution and reload
        working-directory: vendor/packages/logos
        run: npm test -- tests/event-calls.test.ts tests/resource-transactions.test.ts
