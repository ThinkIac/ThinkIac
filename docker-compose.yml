services:
  thinkiac:
    build:
      context: .
      dockerfile: Dockerfile
    image: thinkiac:local
    container_name: thinkiac
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5040
    ports:
      - "${THINKIAC_PORT:-5040}:5040"
    volumes:
      - thinkiac_data:/data

volumes:
  thinkiac_data:
